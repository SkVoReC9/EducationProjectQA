services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  store:
    build: .
    ports:
      - "50051:50051" # gRPC
      - "8080:8080"   # HTTP JSON gateway
    environment:
      DATABASE_URL: postgres://store:store@postgres:5432/store?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
